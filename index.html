<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Site → Text (APITier)</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 16px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    input { padding:10px; font-size:16px; min-width: 320px; flex: 1; }
    button { padding:10px 14px; font-size:16px; cursor:pointer; }
    textarea { width:100%; height:65vh; margin-top:12px; padding:10px; }
    #status { margin-top:10px; white-space:pre-wrap; color:#333; }
    .small { color:#555; margin-top:6px; }
  </style>
</head>
<body>
  <h2>Convert a Website to Text (APITier)</h2>

  <div class="row">
    <input id="url" placeholder="https://example.com" />
    <button id="go">Convert</button>
  </div>

  <div id="status">Enter a URL and click Convert.</div>
  <div class="small">
    If you get a CORS error in the browser, you must call the API from a backend (server/proxy).
  </div>

  <textarea id="out" readonly placeholder="Extracted text will appear here..."></textarea>

  <script>
    // Your API key (WARNING: visible to anyone viewing your GitHub page)
    const API_KEY = "FFgoacRNbm8sGjoPF7KUL6iIOY3nAJYz897qriA7";

    // APITier Web→Text endpoint pattern (same base as their Web→PDF examples)
    // If APITier’s docs show a different exact path for “to/text”, change it here.
    const ENDPOINT = "https://web.apitier.com/convert/url/to/text";

    const urlEl = document.getElementById("url");
    const goBtn = document.getElementById("go");
    const outEl = document.getElementById("out");
    const statusEl = document.getElementById("status");

    function normalizeUrl(u) {
      u = (u || "").trim();
      if (!u) return "";
      if (!/^https?:\/\//i.test(u)) u = "https://" + u;
      return u;
    }

    goBtn.addEventListener("click", async () => {
      const targetUrl = normalizeUrl(urlEl.value);
      if (!targetUrl) {
        statusEl.textContent = "Please enter a URL.";
        return;
      }

      outEl.value = "";
      statusEl.textContent = "Calling APITier…";

      try {
        const apiUrl = `${ENDPOINT}?x-api-key=${encodeURIComponent(API_KEY)}`;

        const res = await fetch(apiUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: targetUrl })
        });

        // If the API returns non-JSON (rare), show raw text
        const contentType = res.headers.get("content-type") || "";
        const raw = await res.text();

        if (!res.ok) {
          statusEl.textContent = `API error ${res.status}:\n${raw}`;
          return;
        }

        if (contentType.includes("application/json")) {
          const data = JSON.parse(raw);

          // Different APIs return different field names; try common ones
          const text =
            data.text ||
            data.content ||
            data.data ||
            data.result ||
            raw;

          outEl.value = (typeof text === "string") ? text : JSON.stringify(text, null, 2);
        } else {
          outEl.value = raw;
        }

        statusEl.textContent = "Done.";
      } catch (e) {
        statusEl.textContent =
          "Failed to fetch.\n\n" +
          "Common reasons:\n" +
          "• CORS blocked in browser (needs server/proxy)\n" +
          "• Wrong endpoint path\n" +
          "• Network blocks the API domain\n\n" +
          "Error: " + (e?.message || e);
      }
    });
  </script>
</body>
</html>
