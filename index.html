<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF Text Extractor</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 16px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    button { padding: 10px 14px; cursor: pointer; }
    textarea { width: 100%; height: 65vh; margin-top: 12px; padding: 10px; }
    #status { margin-top: 10px; white-space: pre-wrap; color: #333; }
  </style>
</head>
<body>
  <h2>Upload PDF → Extract Text</h2>

  <div class="row">
    <input type="file" id="pdf" accept="application/pdf" />
    <button id="extract" disabled>Extract</button>
    <button id="download" disabled>Download .txt</button>
  </div>

  <div id="status">Choose a PDF file.</div>
  <textarea id="out" readonly placeholder="Extracted text will appear here..."></textarea>

  <script>
    const pdfEl = document.getElementById("pdf");
    const extractBtn = document.getElementById("extract");
    const dlBtn = document.getElementById("download");
    const statusEl = document.getElementById("status");
    const outEl = document.getElementById("out");

    let lastText = "";
    let lastFilename = "extracted.txt";

    pdfEl.addEventListener("change", () => {
      const f = pdfEl.files && pdfEl.files[0];
      extractBtn.disabled = !f;
      dlBtn.disabled = true;
      outEl.value = "";
      lastText = "";

      if (f) {
        statusEl.textContent = `Selected: ${f.name}`;
        lastFilename = f.name.replace(/\.pdf$/i, "") + ".txt";
      } else {
        statusEl.textContent = "Choose a PDF file.";
      }
    });

    extractBtn.addEventListener("click", async () => {
      const f = pdfEl.files && pdfEl.files[0];
      if (!f) return;

      statusEl.textContent = "Uploading PDF to local extractor…";
      outEl.value = "";
      dlBtn.disabled = true;
      lastText = "";

      try {
        const form = new FormData();
        form.append("pdf", f);

        // Your local server must expose POST /extract
        const res = await fetch("http://localhost:3000/extract", {
          method: "POST",
          body: form
        });

        if (!res.ok) {
          const msg = await res.text();
          throw new Error(`Server error ${res.status}: ${msg}`);
        }

        const data = await res.json(); // { text: "..." }
        lastText = data.text || "";
        outEl.value = lastText || "(No text extracted.)";

        dlBtn.disabled = !lastText;
        statusEl.textContent = "Done.";
      } catch (e) {
        statusEl.textContent =
          "Failed. Make sure the local server is running at http://localhost:3000\n\n" +
          "Error: " + (e?.message || e);
      }
    });

    dlBtn.addEventListener("click", () => {
      const blob = new Blob([lastText], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = lastFilename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(a.href);
    });
  </script>
</body>
</html>
