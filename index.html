<!doctype html>
<html>
<body>
<h3>Upload file → read text</h3>
<input type="file" id="f">
<pre id="out"></pre>

<script>
document.getElementById("f").onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  const text = await file.text();
  document.getElementById("out").textContent = text;
};
</script>
</body>
</html>
